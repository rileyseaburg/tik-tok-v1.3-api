post:
  summary: Create ACO ads
  description: |
    Create an ACO ad by uploading necessary ad creatives to the library. With this endpoint, you can upload multiple ad texts, titles, materials, and call-to-actions to the library. The platform automatically combines your ad creatives and prepares them for delivery. This is a totally new endpoint in v1.3.

    Notes:
    - The response is a mock result which returns the request parameters you've passed in, because the data processing is not finished instantly.
    - Maximum number of ads: 450 ACO ads per call, 5,000 ads per advertiser account per day.
    - Maximum number of materials:
      * Titles: 1-5
      * Call-to-action texts: 1-3
      * Media info: 1-30
      * Page IDs: 1-3
    - Do not use duplicated ad titles, materials, or call-to-action texts in an ACO ad.
    - Supported advertising objectives: APP_PROMOTION, WEB_CONVERSIONS, TRAFFIC, LEAD_GENERATION
  operationId: createAcoAd
  tags:
    - ad
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - adgroup_id
            - media_info_list
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            adgroup_id:
              type: string
              description: |
                Ad group ID.
                Note: The ID should be of the ad group that you will enable Automated Creative Optimization for, and creative_material_mode for the ad group must be set as DYNAMIC.
            media_info_list:
              type: array
              description: List of media information. Max size - 30.
              maxItems: 30
              items:
                type: object
                required:
                  - media_info
                properties:
                  media_info:
                    $ref: '../schemas/types.yaml#/components/schemas/MediaInfo'
            title_list:
              type: array
              description: |
                List of ad titles (also called ad texts). Ad titles are shown to your audience as part of your ad creative.
                When you pass in tiktok_item_id, you don't need to pass in title_list.
              minItems: 1
              maxItems: 5
              items:
                type: object
                required:
                  - title
                properties:
                  title:
                    type: string
                    description: |
                      Ad title (ad text). If you don't know how to create effective ad texts, you can try the Smart Text feature.
                      - Must be 12-40 characters long
                      - Cannot contain emoji
                      - Each word in Chinese or Japanese counts as two characters
                      - Each letter in English counts as one character
            call_to_action_list:
              type: array
              description: |
                Call-to-action list.
                Note: For TikTok ads, either this field or call_to_action_id must be specified.
                If both are specified, this field will be ignored.
                Maximum of three call-to-action texts per list.
              maxItems: 3
              items:
                $ref: '../schemas/types.yaml#/components/schemas/CallToActionInfo'
            deeplink_list:
              type: array
              description: List of deeplinks. Length range - [0,1]
              maxItems: 1
              items:
                type: object
                properties:
                  deeplink:
                    type: string
                    description: The specific location where you want your audience to go if they have your app installed
                  deeplink_type:
                    type: string
                    description: |
                      The deeplink type. Allowed values differs based on campaign objectives.
                      For an ad that will be included in an iOS 14 campaign, this field cannot be set to DEFERRED_DEEPLINK.
                    enum: [NORMAL, DEFERRED_DEEPLINK]
                    default: NORMAL
            display_name_list:
              type: array
              description: |
                Display names.
                Note: You can pass only one app_name or landing_page_name into each display_name_list object.
              items:
                type: object
                properties:
                  app_name:
                    type: string
                    description: |
                      App name that is displayed in the ad. If not specified, the name in the app store will be used.
                      Number of characters allowed - 1-40.
                      If the name in the app store exceeds 40 characters, you must pass in a new app name with this field.
                  landing_page_name:
                    type: string
                    description: The display name of the landing page, required when the promotion type is landing page. Length limit - 1-40 characters.
            page_list:
              type: array
              description: Page ID list
              minItems: 1
              maxItems: 3
              items:
                type: object
                required:
                  - page_id
                properties:
                  page_id:
                    type: string
                    description: Page ID. To obtain the pages within your ad account, use /page/get/.
            card_list:
              type: array
              description: Card ID list. Length range - [0,1]
              maxItems: 1
              items:
                type: object
                properties:
                  card_id:
                    type: string
                    description: Display Card ID, Gift Code Sticker ID, Countdown Sticker ID, or Download Card ID
            landing_page_urls:
              type: array
              description: |
                Multiple landing page URLs.
                You can pass only one landing_page_url into each landing_page_urls object.
                Note: Once set, this field cannot be updated.
              items:
                type: object
                required:
                  - landing_page_url
                properties:
                  landing_page_url:
                    type: string
                    description: Landing page URL
            common_material:
              type: object
              description: Common material
              properties:
                ad_name:
                  type: string
                  description: |
                    Ad name. Set as " " (Empty string) for it to be automatically generated.
                    The format of auto-generated ad name is - creative name + creation time (e.g. adcreative20210111190739).
                    Character limit is 512 and cannot contain emoji.
                    Each word in Chinese or Japanese counts as two characters, while each letter in English counts as one character.
                    If you don't specify ad name here, you will not be able to change the name via /ad/aco/update/ endpoint.
                call_to_action_id:
                  type: string
                  description: |
                    The ID of the CTA portfolio that you want to use in your ads.
                    A CTA portfolio is a group of auto-optimized CTAs.
                    Note: If both this field and call_to_action_list are specified, call_to_action_list will be ignored.
                creative_authorized:
                  type: boolean
                  description: |
                    Whether you grant displaying some of your ads in our TikTok for Business Creative Center.
                    Only valid for non-US advertisers, the default value is false.
                    Note: creative_authorized can only be used for video ads.
                  default: false
                playable_url:
                  type: string
                  description: Playable material url, valid only in Pangle placement. You can get the url via the /playable/get/ endpoint.
                fallback_type:
                  type: string
                  description: |
                    Fallback Type. If the audience do not have the app installed, you can have them fall back to install the app, or to view a specific web page.
                    If website is chosen, you need to specify the url via landing_page_urls field.
                    Note: Not applicable for Deferred Deeplink.
                  enum: [APP_INSTALL, WEBSITE]
            tracking_info:
              type: object
              description: Tracking information
              properties:
                impression_tracking_urls:
                  type: array
                  description: Default Impression Tracking URL
                  maxItems: 1
                  items:
                    type: string
                click_tracking_urls:
                  type: array
                  description: Click Tracking URL
                  maxItems: 1
                  items:
                    type: string
                tracking_pixel_id:
                  type: string
                  description: The pixel ID that you'd like to track. You can use this field to track offsite events.
                tracking_app_id:
                  type: string
                  description: |
                    The ID of the application that you want to track.
                    Note: This field is currently an allowlist-only feature for the advertising objectives APP_PROMOTION, PRODUCT_SALES, and ENGAGEMENT.
                tracking_offline_event_set_ids:
                  type: array
                  description: |
                    A list of Offline Event set IDs that you want to track.
                    You can use this field to track and measure offline activity from people that see or interact with your ads.
                    Note: Offline Events Tracking is currently an allowlist-only feature.
                  maxItems: 50
                  items:
                    type: string
            identity_id:
              type: string
              description: Required when you are not using Spark Ads (tiktok_item_id)
            identity_type:
              type: string
              description: |
                Required when you are not using Spark Ads (tiktok_item_id).
                The only supported value is CUSTOMIZED_USER.
              enum: [CUSTOMIZED_USER]
            is_smart_creative:
              type: boolean
              description: |
                Whether to create a Smart Creative ad.
                If you want to create a Smart Creative ad, set this field to true.
              default: false
  responses:
    '200':
      description: Successfully created ACO ad
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: The log id of a request, which uniquely identifies the request
              data:
                type: object
                properties:
                  advertiser_id:
                    type: string
                    description: Advertiser ID
                  adgroup_id:
                    type: string
                    description: Ad group ID
                  media_info_list:
                    type: array
                    items:
                      $ref: '../schemas/types.yaml#/components/schemas/MediaInfo'
                  title_list:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Ad title (ad text)
                  common_material:
                    type: object
                    properties:
                      call_to_action_id:
                        type: string
                        description: The ID of the CTA portfolio
                      identity_id:
                        type: string
                        description: Identity ID
                      is_smart_creative:
                        type: boolean
                        description: Whether the ad is a Smart Creative ad
                      identity_type:
                        type: string
                        description: Identity type
                  landing_page_urls:
                    type: array
                    items:
                      type: object
                      properties:
                        landing_page_url:
                          type: string
                          description: Landing page URL
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'