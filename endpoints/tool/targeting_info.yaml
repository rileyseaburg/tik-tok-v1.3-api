post:
  operationId: getTargetingInfo
  summary: Obtain details about location targeting tags by ID
  description: |
    Use this endpoint to get information about location targeting tags by ID.

    You can get details about three types of targeting tags:
    - Zip code IDs (currently only supported for the US)
    - Postal code IDs (currently only supported for Canada, Brazil, Indonesia, Thailand, and Vietnam)
    - Location IDs
    - ISP IDs

    Note:
    - You can only use this endpoint, rather than /tool/region/, to get the information about zip code IDs or postal code IDs.
    - This endpoint requires POST method, because for GET requests the length of URL will be limited.
  tags:
    - tool
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - targeting_ids
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            scene:
              type: string
              description: |
                The targeting type that the specified targeting_ids is used for.
                Default value: GEO
              enum:
                - GEO
                - ISP
            targeting_ids:
              type: array
              description: |
                Targeting tag IDs.
                You can pass in location IDs, zip code IDs or postal code IDs, a combination of location IDs, zip code IDs or postal code IDs, or ISP IDs.
                Max size: 1,000.
              items:
                type: string
            objective_type:
              type: string
              description: |
                Required when scene is set as GEO.
                Campaign objective.
              enum:
                - REACH
                - TRAFFIC
                - VIDEO_VIEWS
                - LEAD_GENERATION
                - ENGAGEMENT
                - APP_PROMOTION
                - WEB_CONVERSIONS
                - PRODUCT_SALES
            promotion_type:
              type: string
              description: |
                Required when scene is set as GEO and objective_type is NOT set as REACH, VIDEO_VIEWS, or ENGAGEMENT.
                Promotion type and you can decide where you'd like to promote your products using this field.
            placements:
              type: array
              description: |
                Required when scene is set as GEO.
                The apps where you want to deliver your ads.
                Note: If you want to get information about zip code IDs or postal code IDs, the value must include PLACEMENT_TIKTOK.
              items:
                type: string
            operating_system:
              type: string
              description: |
                Valid only when scene is set as GEO.
                Device operating system that you want to target.
              enum:
                - ANDROID
                - IOS
            brand_safety_type:
              type: string
              description: |
                Brand safety type. Valid only when scene is set as GEO and placements is set as PLACEMENT_TIKTOK.
                Default value: NO_BRAND_SAFETY
              enum:
                - NO_BRAND_SAFETY
                - EXPANDED_INVENTORY
                - STANDARD_INVENTORY
                - LIMITED_INVENTORY
                - THIRD_PARTY
            brand_safety_partner:
              type: string
              description: |
                Required only when brand_safety_type is THIRD_PARTY.
                Brand safety partner.
              enum:
                - IAS
                - OPEN_SLATE
  responses:
    '200':
      description: Successfully retrieved targeting tag information
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
              - request_id
              - data
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: The log ID of a request, which uniquely identifies the request
              data:
                type: object
                properties:
                  targeting_tag_list:
                    type: array
                    description: Information about the targeting tags that are matched by the specified targeting tag IDs
                    items:
                      $ref: '#/components/schemas/TargetingTag'
                  parent_tags:
                    type: array
                    description: Information about all the parent targeting tags
                    items:
                      $ref: '#/components/schemas/TargetingTag'
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../schemas/responses.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../schemas/responses.yaml#/components/responses/NotFound'
    '429':
      $ref: '../schemas/responses.yaml#/components/responses/TooManyRequests'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'

components:
  schemas:
    TargetingTag:
      type: object
      properties:
        targeting_type:
          type: string
          description: |
            The targeting type that the targeting tag is used for.
            Enum values:
            GEO - Geographical targeting, which consists of administrative region targeting and zip code targeting (or postal code targeting)
            ISP - Internet Service Provider targeting
          enum:
            - GEO
            - ISP
        name:
          type: string
          description: The name of the targeting tag
        status_info:
          type: object
          properties:
            status:
              type: string
              description: |
                The status of the targeting tag.
                ENABLED - can be used for targeting
                DISABLED - cannot be used for targeting
              enum:
                - ENABLED
                - DISABLED
            reason:
              type: string
              description: |
                The reason why the targeting tag cannot be used for targeting.
                Returned when status = DISABLED.
              enum:
                - OFFLINE
                - NOT_SUPPORTED
        geo:
          type: object
          description: |
            Information about the targeting tag that is used for location targeting.
            Returned when targeting_type is GEO.
          properties:
            geo_id:
              type: string
              description: |
                Location ID, zip code ID, or postal code ID.
                When geo_type is ZIP_CODE, pass this value to zipcode_ids in adgroup endpoints.
                When geo_type is not ZIP_CODE, pass this value to location_ids in adgroup endpoints.
            geo_type:
              type: string
              description: The type of location that the geo_id corresponds to
              enum:
                - COUNTRY
                - PROVINCE
                - CITY
                - DISTRICT
                - DMA
                - ZIP_CODE
            description:
              type: string
              description: The description of the targeted location
            region_code:
              type: string
              description: The code of the country or region that the targeted location belongs to
            parent_id:
              type: string
              description: |
                ID of the parent location.
                Returns 0 if no parent location exists.
        isp:
          type: object
          description: |
            Information about the targeting tag that is used for Internet service provider targeting.
            Returned when targeting_type is ISP.
          properties:
            isp_id:
              type: string
              description: The ID of the Internet service provider that you can target
            location_id:
              type: string
              description: The location ID that the isp_id can be used together with. Only location IDs at the country or region level are supported.
            region_code:
              type: string
              description: The code of the region or country that the isp_id belongs to