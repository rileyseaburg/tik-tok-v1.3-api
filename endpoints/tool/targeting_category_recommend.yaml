post:
  operationId: recommendTargetingCategories
  summary: Get recommended interest and action categories
  description: |
    Use this endpoint to get recommended interest and action categories based on historical performance data in the same industries.

    Changes from v1.2 to v1.3:
    - Endpoint path changed from /v1.2/tools/target_recommend_tags/ to /v1.3/tool/targeting_category/recommend/
    - Parameter name changed: region_code → region_codes
    - app_id type changed from number to string
    - Response parameter names changed:
      * name → interest_category_name/action_category_name
      * placement → placements
      * industry_types → special_industries
    - Response parameter types changed:
      * id → interest_category_id/action_category_id (number to string)
  tags:
    - tool
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - region_codes
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            region_codes:
              type: array
              description: List of country or region codes. For example ["US", "JP", "KR"]
              items:
                type: string
            app_id:
              type: string
              description: ID of the mobile app that you want to promote. This field is optional and only valid if you want to promote a mobile app.
  responses:
    '200':
      description: Successfully retrieved recommended categories
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
              - request_id
              - data
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: The log ID of a request, which uniquely identifies the request
              data:
                type: object
                properties:
                  interest_categories:
                    type: array
                    description: Recommended interest categories
                    items:
                      type: object
                      properties:
                        interest_category_id:
                          type: string
                          description: Interest category ID. It can used as one of the targeting settings when creating an ad group.
                        interest_category_name:
                          type: string
                          description: Interest category name
                        placements:
                          type: array
                          description: |
                            List of placements that the interest categories can be used.
                            If blank is returned, it means the interest category can be used in all placements.
                          items:
                            type: string
                        special_industries:
                          type: array
                          description: |
                            Ad categories.
                            Note: If the returned value is empty([]), it means that the interest categories do not support any industry types.
                            This field is only supported for advertisers who are registered in America or Canada.
                          items:
                            type: string
                            enum:
                              - HOUSING
                              - EMPLOYMENT
                              - CREDIT
                  action_categories:
                    type: array
                    description: Recommended action categories
                    items:
                      type: object
                      properties:
                        action_category_id:
                          type: string
                          description: Action category ID. It can be used as one of the targeting settings when creating an ad group.
                        action_category_name:
                          type: string
                          description: Action category name
                        description:
                          type: string
                          description: Action category description
                        scene:
                          type: string
                          description: Action category scene
                          enum:
                            - CREATOR_RELATED
                            - VIDEO_RELATED
                        special_industries:
                          type: array
                          description: |
                            Ad categories.
                            Note: If the returned value is empty([]), it means that the interest categories do not support any industry types.
                            This field is only supported for advertisers who are registered in America or Canada.
                          items:
                            type: string
                            enum:
                              - HOUSING
                              - EMPLOYMENT
                              - CREDIT
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../schemas/responses.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../schemas/responses.yaml#/components/responses/NotFound'
    '429':
      $ref: '../schemas/responses.yaml#/components/responses/TooManyRequests'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'