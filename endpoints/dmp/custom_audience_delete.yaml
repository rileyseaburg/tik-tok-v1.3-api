post:
  summary: Delete audiences
  description: Delete one or more custom audiences
  operationId: deleteCustomAudiences
  tags:
    - dmp
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - custom_audience_ids
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            custom_audience_ids:
              type: array
              description: List of Audience IDs (1-100)
              items:
                type: string
              minItems: 1
              maxItems: 100
  responses:
    '200':
      description: Successfully deleted audiences
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: Request log ID
              data:
                type: object
                description: Returned data
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'