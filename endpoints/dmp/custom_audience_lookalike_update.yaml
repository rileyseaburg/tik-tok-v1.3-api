post:
  summary: Refresh a lookalike audience
  description: Manually refresh a Lookalike Audience
  operationId: updateLookalikeAudience
  tags:
    - dmp
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - custom_audience_ids
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            custom_audience_ids:
              type: array
              description: List of custom audience IDs to refresh
              items:
                type: string
  responses:
    '200':
      description: Successfully refreshed lookalike audience
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: Request log ID
              data:
                type: object
                description: Returned data
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'