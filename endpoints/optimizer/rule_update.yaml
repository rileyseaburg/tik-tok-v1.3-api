post:
  summary: Update rules
  description: Update the details of existing rules
  operationId: updateOptimizerRules
  tags:
    - optimizer
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - rules
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            rules:
              type: array
              description: List of rules to update
              items:
                type: object
                required:
                  - apply_objects
                  - conditions
                  - actions
                  - notification
                  - rule_exec_info
                  - rule_id
                  - name
                properties:
                  apply_objects:
                    type: array
                    description: Objects to apply rules to
                    items:
                      type: object
                      required:
                        - dimension
                        - pre_condition_type
                      properties:
                        dimension:
                          type: string
                          description: Object category
                          enum: [CAMPAIGN, ADGROUP, AD]
                        dimension_ids:
                          type: array
                          description: Object IDs
                          items:
                            type: string
                        pre_condition_type:
                          type: string
                          description: Object filter conditions
                  conditions:
                    type: array
                    description: Rule conditions
                    items:
                      type: object
                      required:
                        - subject_type
                      properties:
                        subject_type:
                          type: string
                          description: Condition subject
                        range_type:
                          type: string
                          description: Time range
                          enum:
                            - TODAY
                            - YESTERDAY
                            - PAST_THREE_DAYS
                            - PAST_FIVE_DAYS
                            - PAST_SEVEN_DAYS
                            - LIFETIME
                        match_type:
                          type: string
                          description: Condition operator
                        values:
                          type: array
                          description: Condition values
                          items:
                            type: string
                        calculation_type:
                          type: string
                          description: |
                            For COST subject_type only
                            Default: OF_EACH_OBJECT
                          enum:
                            - ALL_OBJECTS
                            - OF_EACH_OBJECT
                  actions:
                    type: array
                    description: Actions to take
                    items:
                      type: object
                      required:
                        - subject_type
                      properties:
                        subject_type:
                          type: string
                          description: Action type
                        action_type:
                          type: string
                          description: Adjustment type
                          enum:
                            - INCREASE
                            - DECREASE
                            - ADJUST_TO
                        value_type:
                          type: string
                          description: Value type
                          enum:
                            - EXACT
                            - PERCENT
                        value:
                          type: object
                          description: |
                            Action value settings
                            For INCREASE/DECREASE: use value, use_limit, limit
                            For ADJUST_TO: only value needed
                          properties:
                            value:
                              type: number
                              description: Value to adjust to/by
                            limit:
                              type: number
                              description: |
                                INCREASE: maximum limit
                                DECREASE: minimum limit
                                Required when use_limit is true
                            use_limit:
                              type: boolean
                              description: Whether to use limit value
                        frequency_info:
                          type: object
                          description: Action frequency settings
                          properties:
                            type:
                              type: string
                              enum:
                                - ONLY_ONCE
                                - ONCE_IN_24_H
                                - ONCE_IN_48_H
                                - ONCE_IN_1_W
                                - CUSTOM
                            custom_frequency_type:
                              type: string
                              description: For CUSTOM type
                              enum:
                                - N_MINTUE_Y_TIMES
                                - N_HOUR_Y_TIMES
                                - N_DAY_Y_TIMES
                            time:
                              type: integer
                              description: N value
                            count:
                              type: integer
                              description: Y value
                  notification:
                    type: object
                    description: Notification settings
                    required:
                      - notification_type
                    properties:
                      notification_type:
                        type: string
                        description: |
                          TASK_FINISH: For MESSAGE actions
                          ANY_CHANGES: For non-MESSAGE actions
                          NOT_NOTIFICATION: No notifications
                        enum:
                          - TASK_FINISH
                          - ANY_CHANGES
                          - NOT_NOTIFICATION
                      email_setting:
                        type: object
                        description: Email settings
                        properties:
                          notification_period:
                            type: string
                            enum:
                              - EVERY_TIME
                              - TIME_SCHEDULE
                          email_exec_time:
                            type: array
                            description: Times for TIME_SCHEDULE
                            items:
                              type: string
                          no_result_notification:
                            type: boolean
                            description: Send no-result notifications
                            default: false
                          mute_option:
                            type: string
                            description: Mute/unmute notifications
                            enum:
                              - MUTE
                              - UNMUTE
                  rule_exec_info:
                    type: object
                    description: Rule execution settings
                    required:
                      - exec_time_type
                    properties:
                      exec_time_type:
                        type: string
                        description: Execution schedule type
                        enum:
                          - PER_HALF_HOUR
                          - CUSTOM
                          - HALF_HOUR_IN_SPECIFIC_TIME_PERIOD
                          - SPECIFIC_TIME_ACCURATE_ONCE
                      exec_time:
                        type: string
                        description: |
                          For CUSTOM: "HH:MM"
                          For SPECIFIC_TIME_ACCURATE_ONCE: "YYYY-MM-DD HH:MM"
                      time_period_info:
                        type: array
                        description: For HALF_HOUR_IN_SPECIFIC_TIME_PERIOD
                        items:
                          type: object
                          properties:
                            num:
                              type: array
                              description: |
                                WEEK: [1-7] (Mon-Sun)
                                MONTH: [1-28]
                              items:
                                type: integer
                            start_time:
                              type: string
                              description: Period start time
                            end_time:
                              type: string
                              description: Period end time
                            date_type:
                              type: string
                              description: Date type
                              enum:
                                - DAY
                                - WEEK
                                - MONTH
                  tzone:
                    type: string
                    description: User timezone for notifications
                  rule_id:
                    type: string
                    description: Rule ID to update
                  name:
                    type: string
                    description: Rule name
            lang:
              type: string
              description: |
                Error message language
                ZH: Simplified Chinese
                EN: English (default)
                JA: Japanese
              default: EN
              enum:
                - ZH
                - EN
                - JA
  responses:
    '200':
      description: Successfully updated rules
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: Request log ID
              data:
                type: object
                properties:
                  rule_ids:
                    type: array
                    description: Updated rule IDs
                    items:
                      type: string
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'