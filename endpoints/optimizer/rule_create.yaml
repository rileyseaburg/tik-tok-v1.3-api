post:
  summary: Create rules
  description: Create automated rules for campaigns, ad groups, or ads
  operationId: createOptimizerRule
  tags:
    - optimizer
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - rules
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            rules:
              type: array
              description: List of rules
              items:
                type: object
                required:
                  - apply_objects
                  - conditions
                  - actions
                  - notification
                  - rule_exec_info
                  - name
                properties:
                  apply_objects:
                    type: array
                    description: Objects to apply rules to (campaigns, ad groups, or ads)
                    items:
                      type: object
                      required:
                        - dimension
                        - pre_condition_type
                      properties:
                        dimension:
                          type: string
                          description: Object category
                          enum: [CAMPAIGN, ADGROUP, AD]
                        dimension_ids:
                          type: array
                          description: Object IDs
                          items:
                            type: string
                        pre_condition_type:
                          type: string
                          description: |
                            Object filter conditions:
                            SELECTED: Only selected IDs
                            ALL_ACTIVE_CAMPAIGN: All active campaigns
                            ALL_ACTIVE_AD_GROUP: All active ad groups
                            ALL_ACTIVE_AD: All active ads
                            ALL_ACTIVE_AD_GROUP_UNDER_SELECTED: All active ad groups under selected campaign
                            ALL_ACTIVE_AD_UNDER_SELECTED: All active ads under selected dimensions
                            ALL_INACTIVE_CAMPAIGN: All inactive campaigns
                            ALL_INACTIVE_AD_GROUP: All inactive ad groups
                            ALL_INACTIVE_AD: All inactive ads
                            ALL_INACTIVE_AD_GROUP_UNDER_SELECTED: All inactive ad groups under selected campaign
                            ALL_INACTIVE_AD_UNDER_SELECTED: All inactive ads under selected campaign/ad group
                          enum:
                            - SELECTED
                            - ALL_ACTIVE_CAMPAIGN
                            - ALL_ACTIVE_AD_GROUP
                            - ALL_ACTIVE_AD
                            - ALL_ACTIVE_AD_GROUP_UNDER_SELECTED
                            - ALL_ACTIVE_AD_UNDER_SELECTED
                            - ALL_INACTIVE_CAMPAIGN
                            - ALL_INACTIVE_AD_GROUP
                            - ALL_INACTIVE_AD
                            - ALL_INACTIVE_AD_GROUP_UNDER_SELECTED
                            - ALL_INACTIVE_AD_UNDER_SELECTED
                  conditions:
                    type: array
                    description: Rule conditions
                    items:
                      type: object
                      required:
                        - subject_type
                      properties:
                        subject_type:
                          type: string
                          description: |
                            Condition subject:
                            COST, DAILY_BUDGET_SPENDING_RATE, LIFETIME_BUDGET_SPENDING_RATE,
                            IMPRESSION, CLICK, CONVERSION, CONVERSION_SKAN, CVR, CVR_SKAN,
                            CPA, CPM, CPC, CTR, COST_PER_RESULT, RESULT, RESULT_RATE,
                            BID_STRATEGY, OPTIMIZATION_GOAL, OBJECTIVE, NAME,
                            DAYS_SINCE_CREATION, NO_CONDITION, ROAS_PURCHASE,
                            ROAS_IMPRESSION_ADS, ROAS_PURCHASE_SKAN, ROAS_COMPLETE_PAYMENT,
                            ROAS_PURCHASES_ONSITE, NOT_REAL_TIME_CPA,
                            NOT_REAL_TIME_CONVERSION, NOT_REAL_TIME_CVR
                        range_type:
                          type: string
                          description: Time range for condition
                          enum:
                            - TODAY
                            - YESTERDAY
                            - PAST_THREE_DAYS
                            - PAST_FIVE_DAYS
                            - PAST_SEVEN_DAYS
                            - LIFETIME
                        match_type:
                          type: string
                          description: |
                            Operator for condition:
                            GT (greater than), LT (less than), BETWEEN, MATCH
                            For NAME: CONTAINS, NOT_CONTAINS, START_WITH, END_WITH, STRING_EQUAL
                        values:
                          type: array
                          description: |
                            Condition values (two for BETWEEN)
                            See documentation for type-specific validation rules
                          items:
                            type: string
                        calculation_type:
                          type: string
                          description: |
                            For COST subject_type only
                            Default: OF_EACH_OBJECT
                          enum:
                            - ALL_OBJECTS
                            - OF_EACH_OBJECT
                  actions:
                    type: array
                    description: Actions when conditions are met
                    items:
                      type: object
                      required:
                        - subject_type
                      properties:
                        subject_type:
                          type: string
                          description: Action type
                          enum:
                            - TURN_ON
                            - TURN_OFF
                            - MESSAGE
                            - DAILY_BUDGET
                            - LIFETIME_BUDGET
                            - BID
                        action_type:
                          type: string
                          description: Adjustment type
                          enum:
                            - INCREASE
                            - DECREASE
                            - ADJUST_TO
                        value_type:
                          type: string
                          description: Value type
                          enum:
                            - EXACT
                            - PERCENT
                        value:
                          type: object
                          description: Budget value settings
                          properties:
                            value:
                              type: number
                              description: |
                                Budget value to adjust
                                INCREASE/DECREASE: [0.01, 1000000000000]
                                ADJUST_TO:
                                  CAMPAIGN: [50, 1000000000000]
                                  ADGROUP: [20, 1000000000000]
                            limit:
                              type: number
                              description: |
                                Budget cap/minimum
                                Required for INCREASE/DECREASE
                                CAMPAIGN: [50, 1000000000000]
                                ADGROUP: [20, 1000000000000]
                        frequency_info:
                          type: object
                          description: Frequency settings for budget/bid actions
                          properties:
                            type:
                              type: string
                              enum:
                                - ONLY_ONCE
                                - ONCE_IN_24_H
                                - ONCE_IN_48_H
                                - ONCE_IN_1_W
                                - CUSTOM
                            custom_frequency_type:
                              type: string
                              description: For CUSTOM type
                              enum:
                                - N_MINTUE_Y_TIMES
                                - N_HOUR_Y_TIMES
                                - N_DAY_Y_TIMES
                            time:
                              type: integer
                              description: N value in custom_frequency_type
                            count:
                              type: integer
                              description: Y value in custom_frequency_type
                  notification:
                    type: object
                    description: Notification settings
                    required:
                      - notification_type
                    properties:
                      notification_type:
                        type: string
                        description: |
                          TASK_FINISH: For MESSAGE actions
                          ANY_CHANGES: For non-MESSAGE actions
                          NOT_NOTIFICATION: No notifications
                        enum:
                          - TASK_FINISH
                          - ANY_CHANGES
                          - NOT_NOTIFICATION
                      email_setting:
                        type: object
                        description: Email notification settings
                        properties:
                          notification_period:
                            type: string
                            enum:
                              - EVERY_TIME
                              - TIME_SCHEDULE
                          email_exec_time:
                            type: array
                            description: Notification times for TIME_SCHEDULE
                            items:
                              type: string
                          no_result_notification:
                            type: boolean
                            description: Send notification when no results
                            default: false
                          mute_option:
                            type: string
                            description: Mute/unmute notifications
                            enum:
                              - MUTE
                              - UNMUTE
                  rule_exec_info:
                    type: object
                    description: Rule execution settings
                    required:
                      - exec_time_type
                    properties:
                      exec_time_type:
                        type: string
                        description: Rule execution schedule
                        enum:
                          - PER_HALF_HOUR
                          - CUSTOM
                          - HALF_HOUR_IN_SPECIFIC_TIME_PERIOD
                          - SPECIFIC_TIME_ACCURATE_ONCE
                      exec_time:
                        type: string
                        description: |
                          Execution time for CUSTOM/SPECIFIC_TIME_ACCURATE_ONCE
                          CUSTOM: "HH:MM"
                          SPECIFIC_TIME_ACCURATE_ONCE: "YYYY-MM-DD HH:MM"
                      time_period_info:
                        type: array
                        description: For HALF_HOUR_IN_SPECIFIC_TIME_PERIOD
                        items:
                          type: object
                          properties:
                            num:
                              type: array
                              description: |
                                Required for WEEK/MONTH date_type
                                WEEK: [1-7] (Mon-Sun)
                                MONTH: [1-28]
                              items:
                                type: integer
                            start_time:
                              type: string
                              description: Period start time (HH:MM)
                            end_time:
                              type: string
                              description: Period end time (HH:MM)
                            date_type:
                              type: string
                              description: Date type
                              enum:
                                - DAY
                                - WEEK
                                - MONTH
                  tzone:
                    type: string
                    description: User timezone for notifications
                  name:
                    type: string
                    description: Rule name
                  lang:
                    type: string
                    description: |
                      Error message language
                      Default: EN
                    enum:
                      - ZH
                      - EN
                      - JA
  responses:
    '200':
      description: Successfully created rules
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: Request log ID
              data:
                type: object
                properties:
                  rule_ids:
                    type: array
                    description: Created rule IDs
                    items:
                      type: string
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'