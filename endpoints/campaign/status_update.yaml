post:
  summary: Update the operation statuses of campaigns
  description: |
    Enable, disable or delete campaigns.
    Note: Operation status of deleted campaigns cannot be modified.
  operationId: updateCampaignStatuses
  tags:
    - campaign
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - campaign_ids
            - operation_status
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            campaign_ids:
              type: array
              description: Campaign IDs to update (1-20)
              items:
                type: string
              minItems: 1
              maxItems: 20
            operation_status:
              type: string
              description: |
                Operation to perform
                DELETE: delete campaigns
                DISABLE: pause campaigns
                ENABLE: enable campaigns
                Note: Cannot modify deleted campaigns
              enum:
                - DELETE
                - DISABLE
                - ENABLE
            postback_window_mode:
              type: string
              description: |
                SKAN 4.0 postback mode for iOS14 campaigns
                Only valid when:
                - Campaigns are Dedicated Campaigns
                - operation_status is DISABLE
                - postback_window_mode not configured
                - SKAN 4.0 enabled for App
                MODE1: 0-2 day window (4 day wait)
                MODE2: 3-7 day window (13 day wait)
                MODE3: 8-35 day window (41 day wait)
                Default: MODE1
              enum:
                - POSTBACK_WINDOW_MODE1
                - POSTBACK_WINDOW_MODE2
                - POSTBACK_WINDOW_MODE3
  responses:
    '200':
      description: Successfully updated campaign statuses
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              data:
                type: object
                properties:
                  campaign_ids:
                    type: array
                    description: Modified campaign IDs
                    items:
                      type: string
                  status:
                    type: string
                    description: |
                      Operation performed
                      DELETE, DISABLE, ENABLE
                  campaign_list:
                    type: array
                    description: Campaign status details
                    items:
                      type: object
                      properties:
                        campaign_id:
                          type: string
                          description: Campaign ID
                        status:
                          type: string
                          description: |
                            Current status
                            DELETE: deleted
                            DISABLE: paused
                            ENABLE: enabled
                        postback_window_mode:
                          type: string
                          description: |
                            SKAN postback mode
                            MODE1: 0-2 day window
                            MODE2: 3-7 day window
                            MODE3: 8-35 day window
              request_id:
                type: string
                description: Request log ID
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'