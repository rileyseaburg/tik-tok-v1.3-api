post:
  summary: Update a campaign
  description: Modify a campaign after it has been created
  operationId: updateCampaign
  tags:
    - campaign
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - campaign_id
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            campaign_id:
              type: string
              description: Campaign ID to update
            campaign_name:
              type: string
              description: |
                Campaign name
                Length limit: 512 characters
                No emoji support
                Chinese/Japanese words count as 2 characters
            special_industries:
              type: array
              description: |
                Special ad categories
                Limits targeting options for compliance
                Available for US/Canada advertisers
                Cannot enable if disabled
              items:
                type: string
                enum:
                  - HOUSING
                  - EMPLOYMENT
                  - CREDIT
            budget:
              type: number
              description: |
                Campaign budget
                Must be at least 105% of current spend
                See Budget docs for minimums and ranges
  responses:
    '200':
      description: Successfully updated campaign
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: Request log ID
              data:
                type: object
                properties:
                  advertiser_id:
                    type: string
                    description: Advertiser ID
                  campaign_id:
                    type: string
                    description: Campaign ID
                  create_time:
                    type: string
                    description: Creation time
                  modify_time:
                    type: string
                    description: Last modified time
                  objective_type:
                    type: string
                    description: Advertising objective
                  app_promotion_type:
                    type: string
                    description: |
                      App promotion type
                      APP_INSTALL, APP_RETARGETING, APP_PREREGISTRATION
                  is_search_campaign:
                    type: boolean
                    description: Whether it's a Search Campaign
                  is_smart_performance_campaign:
                    type: boolean
                    description: Whether it's an automated campaign
                  campaign_type:
                    type: string
                    description: |
                      Campaign type
                      REGULAR_CAMPAIGN, IOS14_CAMPAIGN
                  app_id:
                    type: string
                    description: Application ID
                  is_advanced_dedicated_campaign:
                    type: boolean
                    description: Uses advanced delivery models
                  campaign_app_profile_page_state:
                    type: string
                    description: App Profile Page status
                  rf_campaign_type:
                    type: string
                    description: |
                      RF campaign type
                      STANDARD, PULSE
                  campaign_product_source:
                    type: string
                    description: |
                      Product source
                      CATALOG, STORE
                  campaign_name:
                    type: string
                    description: Campaign name
                  special_industries:
                    type: array
                    description: Special ad categories
                    items:
                      type: string
                  budget_optimize_on:
                    type: boolean
                    description: CBO enabled
                  budget_mode:
                    type: string
                    description: Budget mode
                  budget:
                    type: number
                    description: Campaign budget
                  rta_id:
                    type: string
                    description: RTA strategy ID
                  rta_product_selection_enabled:
                    type: boolean
                    description: RTA product selection enabled
                  operation_status:
                    type: string
                    description: Operation status
                  secondary_status:
                    type: string
                    description: Secondary status
                  postback_window_mode:
                    type: string
                    description: SKAN postback mode
                  is_new_structure:
                    type: boolean
                    description: New campaign structure
                  objective:
                    type: string
                    description: Campaign type (APP/LANDING_PAGE)
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'