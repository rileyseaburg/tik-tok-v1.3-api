get:
  summary: Get the results of an asynchronous campaign copy task
  description: |
    Check the results of an asynchronous campaign copy task.
    Recommended to wait ~1 minute after creating task before checking.
    Note: This is an allowlist-only feature.
  operationId: checkCampaignCopyTask
  tags:
    - campaign
  security:
    - accessToken: []
  parameters:
    - name: advertiser_id
      in: query
      required: true
      schema:
        type: string
      description: Advertiser ID
    - name: task_id
      in: query
      required: true
      schema:
        type: string
      description: |
        ID of the async campaign copy task
        Get from /campaign/copy/task/create/
  responses:
    '200':
      description: Successfully retrieved task results
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: Request log ID
              data:
                type: object
                properties:
                  task_status:
                    type: string
                    description: |
                      Task status
                      RUNNING: Being processed
                      SUCCESS: Processed (check task_result)
                      FAILURE: Failed to process
                    enum:
                      - RUNNING
                      - SUCCESS
                      - FAILURE
                  task_info:
                    type: object
                    description: Task result overview
                    properties:
                      total_ad_count:
                        type: integer
                        description: Total ads attempted to copy
                      success_ad_count:
                        type: integer
                        description: Successfully copied ads
                      total_smart_creative_adgroup_count:
                        type: integer
                        description: Total Smart Creative ad groups attempted
                      success_smart_creative_adgroup_count:
                        type: integer
                        description: Successfully copied Smart Creative ad groups
                  task_result:
                    type: object
                    description: Detailed task results
                    properties:
                      campaign_id:
                        type: string
                        description: New campaign ID
                      campaign_name:
                        type: string
                        description: |
                          New campaign name
                          Returned even if copy failed
                      campaign_error_infos:
                        type: array
                        description: Campaign copy errors (empty if none)
                        items:
                          type: string
                      adgroup_result_list:
                        type: array
                        description: Ad group copy results
                        items:
                          type: object
                          properties:
                            adgroup_id:
                              type: string
                              description: New ad group ID
                            adgroup_name:
                              type: string
                              description: |
                                New ad group name
                                Returned even if copy failed
                            total_ad_count:
                              type: integer
                              description: Ads attempted for this group
                            success_ad_count:
                              type: integer
                              description: Successfully copied ads
                            adgroup_error_list:
                              type: array
                              description: Ad group copy errors (empty if none)
                              items:
                                type: string
                            ad_status:
                              type: string
                              description: |
                                Ad copy status
                                ALL_SUCCESS: All ads copied
                                PARTIAL_SUCCESS: Some/all ads failed
                              enum:
                                - ALL_SUCCESS
                                - PARTIAL_SUCCESS
                            is_smart_creative:
                              type: boolean
                              description: Whether it's a Smart Creative ad group
                            smart_creative_result:
                              type: object
                              description: Smart Creative copy results
                              properties:
                                is_success:
                                  type: boolean
                                  description: Whether creative copy succeeded
                                smart_creative_error_list:
                                  type: array
                                  description: Creative copy errors (empty if none)
                                  items:
                                    type: string
                            ad_result_list:
                              type: array
                              description: Individual ad copy results
                              items:
                                type: object
                                properties:
                                  is_success:
                                    type: boolean
                                    description: Whether ad copy succeeded
                                  ad_id:
                                    type: string
                                    description: New ad ID
                                  ad_name:
                                    type: string
                                    description: |
                                      New ad name
                                      Returned even if copy failed
                                  ad_error_list:
                                    type: array
                                    description: Ad copy errors (empty if none)
                                    items:
                                      type: string
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'