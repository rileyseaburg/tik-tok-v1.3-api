post:
  summary: Create an ad group
  description: |
    Create an ad group. At the ad group level, you can configure:
    - Placement
    - Audience settings (see Ad Targeting)
    - Budget
    - Schedules
    - Bidding and optimization options

    Notes:
    - If special_industries is specified at campaign level, ensure ad groups meet targeting requirements
    - For iOS 14 Dedicated Campaigns:
      * Up to 2 active ad groups allowed
      * Set ios14_targeting to IOS14_PLUS for devices with enforced iOS privacy updates
  operationId: createAdGroup
  tags:
    - adgroup
  security:
    - accessToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - advertiser_id
            - campaign_id
            - adgroup_name
            - budget_mode
            - schedule_type
            - schedule_start_time
            - billing_event
            - pacing
          properties:
            advertiser_id:
              type: string
              description: Advertiser ID
            campaign_id:
              type: string
              description: Campaign ID that ad group belongs to
            adgroup_name:
              type: string
              description: |
                Ad group name.
                Length limit - 512 characters, no emoji.
            request_id:
              type: string
              description: |
                Request ID for creating ad groups with duplicate names.
                Supports idempotency to prevent duplicate requests.
                Must be string representation of 64-bit integer.
            shopping_ads_type:
              type: string
              description: |
                Required when objective_type is PRODUCT_SALES.
                Shopping ads type.
              enum: [VIDEO, LIVE, PRODUCT_SHOPPING_ADS]
            identity_id:
              type: string
              description: |
                Required when shopping_ads_type is VIDEO and product_source is SHOWCASE
                or shopping_ads_type is LIVE.
                Identity ID.
            identity_type:
              type: string
              description: |
                Required when shopping_ads_type is VIDEO and product_source is SHOWCASE
                or shopping_ads_type is LIVE.
                Identity type.
              enum: [AUTH_CODE, TT_USER, BC_AUTH_TT]
            identity_authorized_bc_id:
              type: string
              description: |
                Required when identity_type is BC_AUTH_TT.
                Business Center ID for TikTok Account User identity.
            product_source:
              type: string
              description: |
                Required for Video Shopping Ads and Product Shopping Ads.
                Product source for promotion.
              enum: [UNSET, CATALOG, STORE, SHOWCASE]
            catalog_id:
              type: string
              description: |
                Required when product_source is CATALOG or STORE.
                Optional when shopping_ads_type is LIVE.
                Catalog ID.
            catalog_authorized_bc_id:
              type: string
              description: |
                Required when shopping_ads_type is VIDEO and product_source is CATALOG or STORE.
                Optional when shopping_ads_type is LIVE.
                Business Center ID for catalog.
            store_id:
              type: string
              description: |
                Required when:
                - shopping_ads_type is VIDEO and product_source is STORE
                - shopping_ads_type is PRODUCT_SHOPPING_ADS and product_source is STORE
                Optional when shopping_ads_type is LIVE.
                TikTok Shop ID.
            store_authorized_bc_id:
              type: string
              description: |
                Required when store_id is passed.
                Business Center ID authorized for store access.
            promotion_type:
              type: string
              description: |
                Required when objective_type is not REACH, VIDEO_VIEWS, or ENGAGEMENT.
                Promotion type (optimization location).
            promotion_target_type:
              type: string
              description: |
                Valid when objective_type is LEAD_GENERATION.
                Lead Generation promotion type.
              enum: [INSTANT_PAGE, EXTERNAL_WEBSITE]
            messaging_app_type:
              type: string
              description: |
                Valid when promotion_type is LEAD_GEN_CLICK_TO_SOCIAL_MEDIA_APP_MESSAGE.
                Required when optimization_goal is CONVERSATION.
                Instant messaging app type.
              enum: [MESSENGER, WHATSAPP, IM_URL]
            messaging_app_account_id:
              type: string
              description: |
                Required when messaging_app_type is MESSENGER.
                Facebook Page ID for Messenger.
            phone_region_code:
              type: string
              description: |
                Required when messaging_app_type is WHATSAPP.
                WhatsApp phone region code.
            phone_region_calling_code:
              type: string
              description: |
                Required when messaging_app_type is WHATSAPP.
                WhatsApp phone calling code.
            phone_number:
              type: string
              description: |
                Required when messaging_app_type is WHATSAPP.
                WhatsApp phone number.
            promotion_website_type:
              type: string
              description: |
                TikTok Instant Page type.
                Required when app_promotion_type is APP_PREREGISTRATION.
              enum: [UNSET, TIKTOK_NATIVE_PAGE]
            app_id:
              type: string
              description: |
                Required when:
                - objective_type is APP_PROMOTION and app_promotion_type is APP_RETARGETING
                - objective_type is APP_PROMOTION, app_promotion_type is APP_INSTALL/APP_PREREGISTRATION,
                  and not iOS14 Dedicated Campaign
                Application ID of promoted app.
            pixel_id:
              type: string
              description: |
                Pixel ID for landing pages.
                Valid for WEB_CONVERSIONS, PRODUCT_SALES objectives.
            optimization_event:
              type: string
              description: |
                Required when:
                - Promoted object is App with tracking URLs
                - pixel_id is specified
                Conversion event for ad group.
            placement_type:
              type: string
              description: |
                Placement strategy for ad delivery.
                Default - PLACEMENT_TYPE_NORMAL
              enum: [PLACEMENT_TYPE_AUTOMATIC, PLACEMENT_TYPE_NORMAL]
              default: PLACEMENT_TYPE_NORMAL
            placements:
              type: array
              description: |
                Required when placement_type is PLACEMENT_TYPE_NORMAL.
                Apps for ad delivery.
              items:
                type: string
            tiktok_subplacements:
              type: array
              description: |
                Valid when:
                - objective_type is REACH, VIDEO_VIEWS, or ENGAGEMENT
                - placements is ["PLACEMENT_TIKTOK"] and placement_type is PLACEMENT_TYPE_NORMAL
                TikTok subplacements for ads.
              items:
                type: string
                enum: [IN_FEED, SEARCH_FEED, TIKTOK_LITE]
            search_result_enabled:
              type: boolean
              description: Whether to include ads in Search Ads
            comment_disabled:
              type: boolean
              description: Whether to allow comments on TikTok ads
            video_download_disabled:
              type: boolean
              description: Whether users can download video ads on TikTok
            share_disabled:
              type: boolean
              description: Whether to disable sharing to third-party platforms
            blocked_pangle_app_ids:
              type: array
              description: Pangle app block list IDs
              items:
                type: string
            saved_audience_id:
              type: string
              description: |
                Saved Audience ID.
                Valid when:
                - No special_industries in campaign
                - objective_type not PRODUCT_SALES
                - TikTok placement selected
                - auto_targeting_enabled not true
            auto_targeting_enabled:
              type: boolean
              description: Whether to enable automated targeting
            shopping_ads_retargeting_type:
              type: string
              description: |
                Required when shopping_ads_type is VIDEO and product_source is CATALOG.
                Shopping ads retargeting type.
              enum: [LAB1, LAB2, LAB3, OFF]
            shopping_ads_retargeting_actions_days:
              type: integer
              description: |
                Required when shopping_ads_retargeting_type is LAB1 or LAB2.
                Valid time range for audience action.
              enum: [1, 2, 3, 7, 14, 30, 60, 90, 180]
            included_custom_actions:
              type: array
              description: |
                Required when shopping_ads_retargeting_type is LAB3.
                Include conditions for retargeting.
              items:
                $ref: '../schemas/types.yaml#/components/schemas/CustomAction'
            excluded_custom_actions:
              type: array
              description: |
                Required when shopping_ads_retargeting_type is LAB3.
                Exclude conditions for retargeting.
              items:
                $ref: '../schemas/types.yaml#/components/schemas/CustomAction'
            shopping_ads_retargeting_custom_audience_relation:
              type: string
              description: |
                Valid when:
                - shopping_ads_type is VIDEO
                - product_source is CATALOG
                - shopping_ads_retargeting_type is LAB1/LAB2/LAB3
                - audience_ids is passed
                Logical relation between VSA retargeting and custom audiences.
              enum: [OR, AND]
            location_ids:
              type: array
              description: |
                Location IDs to target.
                Required with zipcode_ids.
                Max 3,000 combined.
              items:
                type: string
              maxItems: 3000
            zipcode_ids:
              type: array
              description: |
                Zip/postal code IDs to target.
                Required with location_ids.
                Max 3,000 combined.
              items:
                type: string
              maxItems: 3000
            languages:
              type: array
              description: Target language codes
              items:
                type: string
            gender:
              type: string
              description: Target gender
              enum: [GENDER_FEMALE, GENDER_MALE, GENDER_UNLIMITED]
            age_groups:
              type: array
              description: Target age groups
              items:
                type: string
            spending_power:
              type: string
              description: |
                Target spending power.
                HIGH targets users who spend more than average.
              enum: [ALL, HIGH]
            household_income:
              type: array
              description: Target household income
              items:
                type: string
                enum: [TOP5, TOP10, TOP10_25, TOP25_50]
            audience_ids:
              type: array
              description: List of audience IDs
              items:
                type: string
            smart_audience_enabled:
              type: boolean
              description: Whether to enable Smart audience
            excluded_audience_ids:
              type: array
              description: List of audience IDs to exclude
              items:
                type: string
            interest_category_ids:
              type: array
              description: General interest category IDs
              items:
                type: string
            interest_keyword_ids:
              type: array
              description: Additional interest category IDs
              items:
                type: string
            purchase_intention_keyword_ids:
              type: array
              description: Purchase intention category IDs
              items:
                type: string
            actions:
              type: array
              description: Targeting behavioral categories
              items:
                $ref: '../schemas/types.yaml#/components/schemas/BehavioralCategory'
            smart_interest_behavior_enabled:
              type: boolean
              description: Whether to enable Smart interests & behaviors
            included_pangle_audience_package_ids:
              type: array
              description: |
                Pangle audiences to include.
                Valid for Pangle placement only.
              items:
                type: string
            excluded_pangle_audience_package_ids:
              type: array
              description: |
                Pangle audiences to exclude.
                Valid for Pangle placement only.
              items:
                type: string
            operating_systems:
              type: array
              description: |
                Target operating systems.
                Required for APP_PROMOTION objective or
                TRAFFIC objective with APP promotion type.
                Only one value allowed.
              items:
                type: string
                enum: [ANDROID, IOS]
              maxItems: 1
            min_android_version:
              type: string
              description: Minimum Android version
            ios14_targeting:
              type: string
              description: |
                iOS device targeting.
                Required and must be IOS14_PLUS for iOS14 Dedicated Campaigns.
              enum: [UNSET, IOS14_MINUS, IOS14_PLUS, ALL]
            min_ios_version:
              type: string
              description: |
                Required when ios14_targeting specified.
                Minimum iOS version.
            device_model_ids:
              type: array
              description: Target device model IDs
              items:
                type: string
            network_types:
              type: array
              description: Target connection types
              items:
                type: string
            carrier_ids:
              type: array
              description: Target carrier IDs
              items:
                type: string
            isp_ids:
              type: array
              description: |
                Target Internet service provider IDs.
                Valid with country/region location_ids.
              items:
                type: string
            device_price_ranges:
              type: array
              description: |
                Target device price ranges.
                10000 means 1000+. Must be multiples of 50.
              items:
                type: number
            targeting_expansion:
              $ref: '../schemas/types.yaml#/components/schemas/TargetingExpansion'
            audience_type:
              type: string
              description: |
                Required for APP_RETARGETING app_promotion_type.
                App retargeting audience type.
              enum: [NEW_CUSTOM_AUDIENCE]
            audience_rule:
              $ref: '../schemas/types.yaml#/components/schemas/AudienceRule'
            contextual_tag_ids:
              type: array
              description: |
                Contextual tag IDs.
                Supports REACH and VIDEO_VIEWS objectives.
              items:
                type: string
            brand_safety_type:
              type: string
              description: |
                Brand safety type.
                Valid for TikTok placement only.
              enum:
                - NO_BRAND_SAFETY
                - EXPANDED_INVENTORY
                - STANDARD_INVENTORY
                - LIMITED_INVENTORY
                - THIRD_PARTY
              default: NO_BRAND_SAFETY
            brand_safety_partner:
              type: string
              description: |
                Required when brand_safety_type is THIRD_PARTY.
                Brand safety partner.
              enum: [IAS, OPEN_SLATE]
            category_exclusion_ids:
              type: array
              description: Content exclusion category IDs
              items:
                type: string
            vertical_sensitivity_id:
              type: string
              description: Vertical sensitivity category ID
            budget_mode:
              type: string
              description: |
                Ad group budget mode.
                Ignored when Campaign Budget Optimization enabled.
              enum:
                - BUDGET_MODE_TOTAL
                - BUDGET_MODE_DYNAMIC_DAILY_BUDGET
                - BUDGET_MODE_DAY
            budget:
              type: number
              format: float
              description: |
                Ad group budget.
                Ignored when Campaign Budget Optimization enabled.
            schedule_type:
              type: string
              description: |
                Schedule type.
                SCHEDULE_START_END requires start and end times.
                SCHEDULE_FROM_NOW requires only start time.
              enum: [SCHEDULE_START_END, SCHEDULE_FROM_NOW]
            schedule_start_time:
              type: string
              format: date-time
              description: |
                Schedule start time (UTC+0).
                Format - YYYY-MM-DD HH:MM:SS
                Up to 12 hours earlier than current time.
                Not later than 2028-01-01 00:00:00.
            schedule_end_time:
              type: string
              format: date-time
              description: |
                Required for SCHEDULE_START_END type or BUDGET_MODE_TOTAL mode.
                Schedule end time (UTC+0).
                Format - YYYY-MM-DD HH:MM:SS
                Not later than 2038-01-01 00:00:00.
            dayparting:
              type: string
              description: |
                Ad delivery arrangement string.
                48x7 characters mapping to 30-min slots Mon-Sun.
                1=delivery, 0=non-delivery.
                First char=Mon 0:01-0:30, last=Sun 23:31-0:00.
            optimization_goal:
              type: string
              description: |
                Required when Campaign Budget Optimization enabled.
                Measurable results to drive with ads.
            secondary_optimization_event:
              type: string
              description: |
                Secondary goal for Install/Value optimization goals.
                For enum values see Conversion events.
            message_event_set_id:
              type: string
              description: |
                Required when:
                - promotion_type is LEAD_GEN_CLICK_TO_SOCIAL_MEDIA_APP_MESSAGE
                - optimization_goal is CONVERSATION
                - Messaging app account doesn't match existing event set
                Message event set ID.
            frequency:
              type: integer
              minimum: 1
              maximum: 1000
              description: |
                Frequency cap for REACH ads.
                With frequency_schedule controls ad frequency.
                1 <= frequency <= 1000
                1 <= frequency_schedule <= 30
            frequency_schedule:
              type: integer
              minimum: 1
              maximum: 30
              description: |
                Schedule period for frequency cap.
                With frequency controls ad frequency.
            bid_type:
              type: string
              description: |
                Required when Campaign Budget Optimization enabled.
                Bidding strategy for cost/budget management.
            bid_price:
              type: number
              format: float
              description: |
                Bid price for Cost Cap strategy.
                Average cost per result to achieve.
            conversion_bid_price:
              type: number
              format: float
              description: |
                Required for oCPM billing and custom bidding.
                Target cost per conversion.
            deep_bid_type:
              type: string
              description: |
                Required for CBO with VALUE optimization.
                In-app event bidding strategy.
              enum: [VO_MIN_ROAS, VO_HIGHEST_VALUE]
            roas_bid:
              type: number
              format: float
              description: |
                Required when deep_bid_type is VO_MIN_ROAS.
                ROAS goal for Value Optimization.
            vbo_window:
              type: string
              description: |
                Time window for VBO IAA bidding strategy.
                Default - SEVEN_DAYS
              enum: [SEVEN_DAYS, ZERO_DAY]
              default: SEVEN_DAYS
            bid_display_mode:
              type: string
              description: |
                Required for VIDEO_VIEW objective.
                How to calculate Cost per View.
            next_day_retention:
              type: number
              format: float
              minimum: 0
              maximum: 1
              exclusiveMinimum: true
              description: |
                Day 2 retention ratio.
                Valid for Pangle placement with NEXT_DAY_OPEN optimization.
                Formula - conversion_bid_price/deep_cpa_bid
            click_attribution_window:
              type: string
              description: |
                Click-through attribution window.
                Time between click and conversion.
              enum: [OFF, ONE_DAY, SEVEN_DAYS, FOURTEEN_DAYS, TWENTY_EIGHT_DAYS]
            engaged_view_attribution_window:
              type: string
              description: |
                Engaged view-through window.
                Time after 6s video view for conversion.
              enum: [ONE_DAY, SEVEN_DAYS]
            view_attribution_window:
              type: string
              description: |
                View-through attribution window.
                Time between view and conversion.
              enum: [OFF, ONE_DAY, SEVEN_DAYS]
            attribution_event_count:
              type: string
              description: |
                Event count type.
                How to count conversions after view/click.
              enum: [UNSET, EVERY, ONCE]
            billing_event:
              type: string
              description: Events to pay for
            pacing:
              type: string
              description: |
                Budget pacing mode.
                SMOOTH=even distribution
                FAST=quick results
              enum: [PACING_MODE_SMOOTH, PACING_MODE_FAST]
            statistic_type:
              type: string
              description: |
                Conversion bid statistic type.
                EVERYTIME=Each Purchase
                NONE=Unique Purchase
              enum: [EVERYTIME, NONE]
            is_hfss:
              type: boolean
              description: Whether promoted content is HFSS food
            operation_status:
              type: string
              description: |
                Initial ad group status.
                Default - ENABLE
              enum: [ENABLE, DISABLE]
              default: ENABLE
            creative_material_mode:
              type: string
              description: |
                Creative delivery strategy.
                Default - CUSTOM
              enum: [CUSTOM, DYNAMIC]
              default: CUSTOM
            adgroup_app_profile_page_state:
              type: string
              description: Whether to use App Profile Page
              enum: [ON, OFF]
  responses:
    '200':
      description: Successfully created ad group
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                description: Response code
              message:
                type: string
                description: Response message
              request_id:
                type: string
                description: Request log ID
              data:
                $ref: '../schemas/responses.yaml#/components/schemas/AdGroupResponse'
    '400':
      $ref: '../schemas/responses.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../schemas/responses.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../schemas/responses.yaml#/components/responses/InternalError'